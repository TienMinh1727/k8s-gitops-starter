replicaCount: 2

image:
  repository: ghcr.io/tienminh1727/k8s-gitops-starter
  tag: "6310216376cf0ac1614bc318a9f7db6612bcb954"   # set by CI
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  host: demo.example.com
  tls:
    enabled: false
    clusterIssuer: letsencrypt-prod

podDisruptionBudget:
  enabled: true
  minAvailable: 1
